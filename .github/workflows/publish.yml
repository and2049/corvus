# Releases are GitHub release assets: standalone `bun build --compile` binaries.
# Unlike redsun's single-runner cross-compile, corvus builds each target on its
# native runner, because node-datachannel and @opentui/core ship platform-
# specific native binaries that do not cross-compile reliably.
name: publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag }}

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            echo "No tag found"; exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG#v} (tag: ${TAG})"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-14
          - target: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Build and archive
        run: bun run publish
        working-directory: packages/tui
        env:
          CORVUS_VERSION: ${{ needs.version.outputs.version }}
          CORVUS_CHANNEL: release
      - uses: actions/upload-artifact@v4
        with:
          name: corvus-${{ matrix.target }}
          path: |
            packages/tui/dist/*.tar.gz
            packages/tui/dist/*.zip
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # Draft: reviewed and published by hand. The installers ship alongside the
      # binaries so releases/latest/download/install resolves for fresh installs
      # and `corvus upgrade`.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            install
            install.ps1
